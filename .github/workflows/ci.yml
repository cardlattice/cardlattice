name: CI
on:
  push:
    branches: [main, 'luna/**']
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: cardlattice
          POSTGRES_PASSWORD: ci-test-only-password
          POSTGRES_DB: cardlattice
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U cardlattice"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgres://cardlattice:ci-test-only-password@localhost:5432/cardlattice
      CONTRIBUTOR_TOKEN: ci-contributor-capability-test-only-123456789
      MODERATOR_TOKEN: ci-moderator-capability-test-only-123456789
      METRICS_TOKEN: ci-metrics-capability-test-only-123456789
      RUST_BACKTRACE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.21.0'
      - run: npm install --global pnpm@12.4.1
      - run: rustup update stable && rustup default stable && rustup component add clippy rustfmt
      - name: Cache Rust dependencies and Cargo tools
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Keyed by the installed compiler, Cargo manifests, lockfile and build flags.
          # Includes target/debug, target/release and tools installed in ~/.cargo/bin.
          cache-on-failure: true
      - run: cargo install --locked cargo-nextest cargo-audit cargo-deny
      - run: pnpm install --frozen-lockfile
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo nextest run --workspace --all-features
      - run: cargo test --workspace --doc --all-features
      - run: bash scripts/audit.sh
      - run: pnpm check
      - name: Verify generated API contract
        run: |
          cargo run --quiet -p cardlattice-api -- openapi > docs/openapi.json
          pnpm --filter @cardlattice/web generate
          git diff --exit-code -- docs/openapi.json apps/web/src/generated
      - run: cargo build --release --package cardlattice-api
      - name: Prepare original development catalogue
        run: |
          target/release/cardlattice-api migrate
          target/release/cardlattice-api seed
          target/release/cardlattice-api serve > /tmp/cardlattice-api.log 2>&1 &
          curl --retry 20 --retry-connrefused --retry-delay 1 -fsS http://localhost:8080/readyz
      - name: Browser tests with preinstalled Playwright dependencies
        run: ./scripts/browser-tests-ci.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: browser-validation
          path: apps/web/test-results
          retention-days: 7
      - name: Set up Docker build cache
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Docker packaging
        uses: docker/bake-action@5be5f02ff8819ecd3092ea6b2e6261c31774f2b4 # v6
        with:
          source: .
          files: compose.yaml
          # migrate and seed use the same Dockerfile and context as api.
          targets: api,web
          load: true
          set: |
            api.cache-from=type=gha,scope=ci-api
            api.cache-to=type=gha,scope=ci-api,mode=max
            web.cache-from=type=gha,scope=ci-web
            web.cache-to=type=gha,scope=ci-web,mode=max
